[package]
name = "tension-core"
version = "0.1.0"
edition = "2021"
description = "TensionCore interpreter: loads a guest game.wasm and supplies the tension::io host ABI"

[features]
default = ["audio", "ai"]
audio = ["dep:cpal"]
# In-process llama.cpp. Default: it turns on a ~2 min vendored C++ build
# (needs cmake + g++). Build with `--no-default-features --features audio`
# and `ai` falls back to the deterministic stub.
ai = ["dep:llama-cpp-2", "dep:encoding_rs"]
# Test-only: lets the binary write the DWARF it synthesised to a file, so the
# E2E test can read `DW_AT_comp_dir` out of an external process instead of
# under lldb. The flag is also compiled in for debug builds (see main.rs), which
# is what `cargo test` hands an integration test; a release build without this
# feature does not contain it at all.
test-dump = []

[[bin]]
name = "tension-core"
path = "src/main.rs"

[dependencies]
wasmtime = "=24.0.13"
anyhow = "1.0.104"
cpal = { version = "0.18.2", optional = true }
arc-swap = "1.7"
llama-cpp-2 = { version = "0.1.156", optional = true }
# `token_to_piece` takes an `encoding_rs::Decoder` and llama-cpp-2 does not
# re-export it, so the real adapter needs it directly (behind `ai`).
encoding_rs = { version = "0.8.35", optional = true }
# World compiler (P8c). Author-facing input warrants a mature parser: a
# hand-rolled YAML subset would turn our bugs into rejections of valid
# author files. MIT OR Apache-2.0; pinned like wasmtime.
yaml-rust2 = "=0.13.0"
# The adapter loader calls dlopen/dlsym/dlclose directly rather than pulling in a
# loading crate. libc is already in the tree through wasmtime; naming it makes
# the dependency honest rather than implicit.
libc = "0.2"

[dev-dependencies]
# Already in the tree through wasmtime, so this adds no download. `example_adoption`
# parses the examples' package.json and (JSONC) launch.json as data rather than
# grepping them: a structural check that cannot be fooled by a comment.
serde_json = "1.0"
