[package]
name = "tension-core"
version = "0.1.0"
edition = "2021"
description = "TensionCore interpreter: loads a guest game.wasm and supplies the tension::io host ABI"

[features]
# `render2d-core` is on by default since Pass B: `cargo build` produces a binary
# with the 2D renderer in core, full stop. The feature survives as a bisect
# escape hatch (`--no-default-features`, or `TENSION_RENDER2D=cpp` in
# `scripts/build-native.mjs`), which loads the C++ DSO instead. Pass C removes
# the flag and the DSO together.
default = ["audio", "ai", "render2d-core"]
audio = ["dep:cpal"]
# In-process llama.cpp. Default: it turns on a ~2 min vendored C++ build
# (needs cmake + g++). Build with `--no-default-features --features audio`
# and `ai` falls back to the deterministic stub.
ai = ["dep:llama-cpp-2", "dep:encoding_rs"]
# The 2D renderer in core instead of in a capability DSO.
#
# On (the default) this binary registers the ten `tension::2d` imports itself,
# and a `tension::2d` DSO named on the command line is skipped rather than
# loaded. Off, the imports come from `tension-2d/build/libtension_2d.so` and a
# run that names no `--capability` simply does not have them — which is the
# pre-merge behaviour, kept reachable so a bisect can answer "is this the port?"
# without a rebuild of anything else.
#
# A feature rather than a runtime flag because it decides which code exists, not
# which code runs: `link_2d` is compiled in or out.
render2d-core = []
# SDL3 *inside* the binary, for the one artifact that ships.
#
# `sdl3-sys`'s `build-from-source-static` builds SDL from the vendored source
# crate (`sdl3-src`, pinned by the sys crate to the SDL version its headers were
# generated from, so the two cannot drift) with CMake and links the archive into
# this binary. A packaged host then needs no `libSDL3.so.0` on the machine that
# runs it — which is the difference between a `dist/` that runs anywhere and one
# that runs on the machine it was built on.
#
# Off by default, because it costs a full SDL CMake build the first time and
# `cargo build` for iteration should not. `scripts/build-native.mjs` turns it on
# for the payload binary, which is the only artifact `tension build` copies.
# Spelling the dynamic build by hand is the default:
#
#     cargo build                                  static SDL3?  no
#     cargo build --features static-sdl3           yes
#     npm run build:native                         yes (the payload binary)
#
# It needs CMake and a C compiler — both already required by the OGRE-Next
# bootstrap — and the crate is fetched from crates.io on the first build of a
# checkout (5.7 MB), so an offline build needs it vendored or in the cargo cache.
static-sdl3 = ["sdl3/build-from-source-static"]

[[bin]]
name = "tension-core"
path = "src/main.rs"

[dependencies]
wasmtime = "=24.0.13"
anyhow = "1.0.104"
# The host owns the window. `sdl3` is core infrastructure now, not a capability
# dependency, so it is unconditional: a feature-gated window would make two core
# configurations to keep honest, and the north star has no "core without a
# window" case.
#
# The `ash` feature makes `sdl3`'s Vulkan handles *be* `ash::vk` handles, so
# `window.vulkan_create_surface(instance.handle())` type-checks without a cast.
#
# Both pinned exactly, for the `naga` reason below: a floating minor on a binding
# crate is a runtime surprise. The pair was chosen so `sdl3-sys` 0.7.3 (generated
# from SDL 3.4.20 headers) builds against the SDL 3.4.18 this tree ships — that
# combination is verified, not assumed.
sdl3 = { version = "=0.22.0", features = ["ash"] }
ash = "=0.38.0"
cpal = { version = "0.18.2", optional = true }
arc-swap = "1.7"
llama-cpp-2 = { version = "0.1.156", optional = true }
# `token_to_piece` takes an `encoding_rs::Decoder` and llama-cpp-2 does not
# re-export it, so the real adapter needs it directly (behind `ai`).
encoding_rs = { version = "0.8.35", optional = true }
# World compiler (P8c). Author-facing input warrants a mature parser: a
# hand-rolled YAML subset would turn our bugs into rejections of valid
# author files. MIT OR Apache-2.0; pinned like wasmtime.
yaml-rust2 = "=0.13.0"
# The adapter loader calls dlopen/dlsym/dlclose directly rather than pulling in a
# loading crate. libc is already in the tree through wasmtime; naming it makes
# the dependency honest rather than implicit.
libc = "0.2"
# Shader source generation. A path dependency rather than a workspace:
# `tension-core` is standalone (no `[workspace]` anywhere in this tree), and
# the crate is versioned with it.
tension-shadergen = { path = "../tension-shadergen" }

# Cranelift is already in the tree as Wasmtime's compiler (same 0.111.13), so
# naming it adds no download and no new licence — the argument the `libc` entry
# above makes. The graph compiler's CPU lowering uses it directly.
cranelift-codegen = "=0.111.13"
cranelift-frontend = "=0.111.13"
cranelift-native = "=0.111.13"

# GLSL -> SPIR-V for runtime pipeline compilation (pipeline/naga_backend.rs).
# Same crate and version as `tension-shadergen` uses, so one copy is linked.
#
# naga is developed in the wgpu repo (gfx-rs/naga is archived).
# Pinned to 29.0.4: 30.0.1's glsl-in feature fails to compile. Retested
# 2026-11-06 against a fresh crates.io artifact and it still fails:
#
#   error[E0599]: no method named `apply_default_interpolation` found for
#   enum `ir::Binding` in the current scope
#     --> naga-30.0.1/src/front/glsl/variables.rs:467:25
#
# The cause is a cfg gate, not a missing API. The method lives in
# `src/front/interpolator.rs`, which 29.0.4 declares unconditionally and
# 30.0.1 declares only under
# `#[cfg(any(feature = "spv-in", feature = "wgsl-in"))]` (front/mod.rs:5-6) —
# omitting `glsl-in`, which is the feature that uses it. Adding `wgsl-in` does make 30.0.1 compile;
# that is not adopted, because it means shipping on a feature combination
# upstream does not test, to satisfy a gate that clearly should have said
# `any(spv-in, wgsl-in, glsl-in)`.
#
# Reproduction: `cargo check --manifest-path tension-core/Cargo.toml
# --all-features` with this line set to 30.0.1. 29.0.4 builds and its output
# renders correctly (scripts/test-2d.mjs, pixel assertions).
# Do not bump without testing glsl-in first.
naga = { version = "29.0.4", features = ["glsl-in", "spv-out"] }

[dev-dependencies]
# Already in the tree through wasmtime, so this adds no download. `example_adoption`
# parses the examples' package.json and (JSONC) launch.json as data rather than
# grepping them: a structural check that cannot be fooled by a comment.
serde_json = "1.0"

# The surface probe needs a real window and a real Vulkan instance, so it is an
# ordinary binary rather than a `#[test]` — see the file's header on the
# `sdl3` main-thread rule.
[[test]]
name = "platform_surface"
harness = false

# The pump probe, for the same reason as `platform_surface`: a real window and
# the `sdl3` main-thread rule.
[[test]]
name = "platform_window"
harness = false

# The control-bus probe: a real window plus the queue, same main-thread rule.
[[test]]
name = "platform_control"
harness = false

# The guest window API's state machine: create, -EBUSY on a second, info() on
# nothing, close, and a Vulkan window's surface. `harness = false` for
# `platform_surface`'s reason — one window per process and one SDL main thread.
[[test]]
name = "platform_create"
harness = false

# The event dispatcher: layer registration, mask filtering, the cap, the
# re-entrancy guard, clear-on-teardown, and the pump's translation of a real
# resize. `harness = false` for `platform_surface`'s reason — one SDL main
# thread per process.
[[test]]
name = "platform_events"
harness = false

# The end-to-end proof: SDL3's window and surface handed to Ogre-Next.
[[test]]
name = "ogre_host_surface"
harness = false

# The 2D renderer's device, window claim and swapchain guard. `harness = false`
# for `platform_surface`'s reason: `sdl3::init()` lets the first calling thread
# claim main-thread status, so a normal `#[test]` would pass once and refuse
# every test after it. The probe needs a GPU, so it skips cleanly (and says so)
# when none is usable — see the file's header.
[[test]]
name = "render2d_open"
harness = false

# The parity proof: the Rust compile's SPIR-V against the C++ build's modules,
# the ordering table against the graph, and (when both binaries exist) the same
# guest through both backends. `harness = false` because Part C runs child
# processes and wants one ordered narrative rather than a per-test summary.
[[test]]
name = "render2d_parity"
harness = false
