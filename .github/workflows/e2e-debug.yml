# The DWARF E2E assertions, on every push.
#
# Scope: two integration targets, tests/e2e_debug.rs and tests/debugger.rs.
#
#   e2e_debug  the host's `--debug` behaviours: pass-through, the legacy guest
#              and its report, and `--symbol-path` reaching the hint.
#   debugger   the same claims where a person meets them — the startup report
#              that names DWARF, the source map and the lldb recipe, plus a
#              real source breakpoint bound under lldb in a debug guest.
#
# The full suite (`npm test`) is not run here: it needs the OGRE fixtures and a
# display, which is what ci/Dockerfile is for.
#
# Why not the container (`node ci/docker.mjs test`): the image is built from
# ci/Dockerfile, whose line 30 copies locally built OGRE-Next and freeimage
# packages out of ci/ogre-next-pkg/. That directory is not in the tree and the
# packages are not published anywhere, so the image cannot be built on a
# runner. Wiring the container is a follow-up that needs those packages
# published first; this job takes the toolchain directly instead.
#
# The toolchain is what build.rs requires, measured rather than guessed:
#   zig        - `zig build` for tension-res (build.rs:57)
#   gfortran   - tension-solver/build.sh, run from build.rs:162
#   cc         - five C fixtures compiled unconditionally (build.rs:239-381);
#                present in the runner image via build-essential
#   SDL3       - `sdl3` is an unconditional dependency of the core, because the
#                host owns the window. It links under `--no-default-features`
#                too, which is how this job builds. The runner image does not
#                ship it; it comes from apt below.
#   lldb       - tests/debugger.rs drives it through tools/e2e-debugger, and on
#                Linux it consumes wasmtime's GDB-JIT registration, so the
#                breakpoint test is green here. It is *not* added for Windows:
#                lldb there registers no JIT image at all, measured — the test
#                says so and asserts only the report (`docs/debugging.md`).
#   node       - only to run `tools/e2e-debugger/runner.js`, which the test
#                spawns. No `npm install`, and no compiler: the debug guest the
#                breakpoint assertions read is committed at
#                `tension-core/tests/programs/fixtures/debug/rt-guards.wasm`.
#
#                An earlier version of this job vendored the compiler here, and
#                it failed on a fresh runner before a single test ran:
#
#                  npm error path /home/runner/work/Tension/Tension/.packs/yabgu_gm-tensionscript-0.14.1-g03e0507bbaab.tar
#                  npm error enoent ENOENT: no such file or directory
#
#                `.packs/` is gitignored and rebuilt per machine, so nothing in
#                this job could produce it. The fixture is the answer: a pinned
#                compiler's `--debug --sourceMap` output, a few hundred KB,
#                committed for the same reason `examples/*/build/*.wasm` are, and
#                with the recipe to regenerate it in the README beside it.
# Nothing else is needed because `--no-default-features` drops cpal (no ALSA
# headers) and llama-cpp-2 (no CMake/libclang C++ build). The E2E tests touch
# neither.

name: E2E debug

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-debug:
    name: "E2E debug"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **The one submodule this job needs.** `tension-core/build.rs:238`
      # compiles `third_party/ImageViewer/src/format/IwiFile.cpp` into the host
      # and panics when it is absent, so a checkout without it fails before a
      # single test runs:
      #
      #   thread 'main' panicked at build.rs:238:
      #   third_party/ImageViewer/src/format/IwiFile.cpp is missing
      #
      # TensionScript is deliberately **not** fetched: the debug guest the
      # breakpoint assertions bind in is committed, so this job needs no
      # compiler (see the header). `ogre-next` is not fetched either: it is a
      # large build tree, `build.rs` names no other submodule (grep
      # `third_party/` in it), and fetching it here would cost minutes to
      # compile nothing.
      - name: Initialise the submodule this target needs
        run: git submodule update --init --depth 1 third_party/ImageViewer

      - uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry and tension-core/target. Placed after the
      # toolchain step on purpose: rust-cache keys on `rustc -V`, so it must
      # see the final toolchain. The measured run was 3 m 36 s, of which
      # ~3 m 10 s was compiling dependencies and ~4 s was the tests - the
      # cache attacks that ratio, not the test time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tension-core -> target"

      # Zig's own compilation cache. Without this, build.rs re-runs `zig build`
      # on every job (a fresh checkout gives every file a new mtime, so
      # `cargo:rerun-if-changed` on a directory always fires), and a cold
      # tension-res build measures 137 s against 0.06 s warm - which is where
      # almost all of the remaining job time goes. The cache is
      # content-addressed, so a stale entry is harmless: zig revalidates it.
      #
      # Both directories are needed, and the second is the one that matters:
      # `zig build` keys its step graph on the *local* cache at
      # tension-res/.zig-cache (inside the checkout, so wiped every run), and
      # only falls back to ~/.cache/zig for content. Caching the global one
      # alone was measured as no improvement at all.
      - name: Cache Zig's build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            tension-res/.zig-cache
          key: zig-0.17.0-v2-${{ runner.os }}-${{ hashFiles('tension-res/build.zig', 'tension-res/src/**', 'tension-res/include/**') }}
          restore-keys: |
            zig-0.17.0-v2-${{ runner.os }}-

      - name: Install gfortran and lldb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran lldb

      # The core links libSDL3 on every build now that the host owns the
      # window, so the linker needs it whether or not a test opens one:
      #   rust-lld: error: unable to find library -lSDL3
      #
      # Measured rather than assumed: Ubuntu 26.04 (what `ubuntu-latest`
      # resolves to) ships libsdl3-dev 3.4.2, and all 22 SDL_* symbols
      # tension-core references are exported by it. The binding crate's own
      # floor is 3.1.3 (sdl3-sys `config.txt: lib_min_version`).
      - name: Install SDL3
        run: |
          sudo apt-get install -y --no-install-recommends libsdl3-dev

      # Zig is pinned to the version this tree is built and tested with
      # locally (0.17.0), and the download is checksum-verified: a build
      # script that shells out to a compiler should not silently change
      # compiler because a URL moved. build.rs accepts Zig >= 0.16; 0.17.0 is
      # what the Dockerfile's `pacman -S zig` resolves to in the project's own
      # image at the time of writing.
      - name: Install Zig 0.17.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" \
            | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          zig version
          gfortran --version | head -1
          cc --version | head -1
          # Load-bearing, not diagnostic: tests/debugger.rs fails without it
          # (a missing debugger is a missing fixture, per support/ci.rs), and
          # libtest hides a passing test's output, so name the binary here.
          lldb --version | head -1

      - name: E2E debug assertions
        run: cargo test --manifest-path tension-core/Cargo.toml --no-default-features --test e2e_debug

      # The guest-breakpoint target, filtered by name. Every test named here
      # reads the committed fixture and needs nothing built:
      #
      #   the_committed_debug_fixture_carries_dwarf   the artifact is in the tree
      #   the_debug_report_names_what_a_debugger_can_see   the startup report
      #   a_source_breakpoint_binds_in_a_promise_guest     binds for real here
      #   a_guest_without_dwarf_cannot_be_stopped_at_a_source_line
      #                                              the control that keeps the
      #                                              one above from being vacuous
      #
      # Two tests are left out **by name**, and the filters are the reason this
      # step spells them: `--test debugger` alone would run them and turn a
      # known compiler gap into a red job.
      #
      # The stack-switching test used to be excluded here for a measured
      # reason — the pinned 0.14.1 threw `type form is not a function type` on
      # any continuation type and shipped no `.debug_*` sections at all. The pin
      # now carries that fix, and `fixtures/debug/main-policy.wasm` is a
      # committed stack-switching guest with DWARF, so the assertion is real
      # here: it binds a `.ts` breakpoint inside an async function.
      #
      #   the two build paths
      #     `support/programs.rs` resolves a debug guest as fixture, then build
      #     if `node_modules/@yabgu_gm/tensionscript` exists, then one printed
      #     line. Nothing here installs a compiler, so nothing here takes the
      #     second path — which is why the fixture test above is in the list: if
      #     the fixture were deleted, the other three would print a line and pass
      #     without measuring anything.
      #
      # No `TENSION_TEST_ALLOW_SKIP` is set on purpose: a missing debugger must
      # fail the job rather than turn the guard into a green line with nothing
      # behind it.
      - name: Guest breakpoint assertions
        run: |
          cargo test --manifest-path tension-core/Cargo.toml --no-default-features \
            --test debugger -- \
              the_committed_debug_fixture_carries_dwarf \
              the_debug_report_names_what_a_debugger_can_see \
              a_source_breakpoint_binds_in_a_promise_guest \
              a_source_breakpoint_binds_in_a_stack_switching_guest \
              a_guest_without_dwarf_cannot_be_stopped_at_a_source_line

      # **The wake path and the strand count — the two behaviours `--test threads`
      # is here for.**
      #
      # Nothing ran `--test threads` in CI before this step, so the thread ABI's
      # five assertions and the wake guard were local-only. This runs the guard
      # **by name**, and the filter is the reason the step spells it: the other
      # five tests build their guests with the vendored compiler, which this job
      # cannot install (`I19` — `.packs/` is gitignored and rebuilt per machine,
      # which is the `ENOENT` recorded above). Running `--test threads` whole
      # would go red on a missing compiler, not on a missing wake.
      #
      # `wake-on-worker` needs no compiler here because its artifact is committed
      # at `tension-core/tests/programs/fixtures/thread/wake-on-worker.wasm`.
      # `tests/support/programs.rs` builds from source when a checkout has a
      # compiler and uses that fixture when it does not, so this job takes the
      # fixture path and a developer's run takes the source path. Both run the
      # same test; the recipe that regenerates the bytes is in the README beside
      # them.
      #
      # No `TENSION_TEST_ALLOW_SKIP` here either: a deleted fixture must fail the
      # job, not skip it.
      #
      # **Three filters, all by name** (DL28 added the third). `libtest` ORs multiple
      # filter arguments, and
      # both tests take the fixture path above: `two-waiters-late` needs no compiler
      # for the same reason `wake-on-worker` does not. Adding a third guest to this
      # step means adding its committed fixture beside theirs — the `.gitignore`
      # negation for `fixtures/thread/*.wasm` is what makes it travel.
      - name: Wake path guard
        run: |
          cargo test --manifest-path tension-core/Cargo.toml --no-default-features \
            --test threads -- \
              a_task_parked_on_a_worker_is_resumed_by_a_sticky_wake \
              a_second_waiter_is_refused_when_the_completion_arrives_after_both_parks \
              a_foreign_delivery_fails_the_run_by_name

      # **The stackful proofs (I61).** Two targets that existed and passed and that no
      # job ran — the vacuous-gate class, with six receipts on this project already.
      # Both halves of the capability table live here: `--test fiber` is DL24's
      # measurement that a host import can suspend and resume a guest call, and
      # `--test fiber-executor` is DL25's executor (park suspends, a wake resumes, a
      # stranded task is named, a foreign wake is refused).
      #
      # Nothing here needs a compiler, a fixture or a window: both guests are inline
      # WAT compiled by wasmtime's own `wat` support at run time, so this step pays no
      # install and takes no skip path. The **12** tests are the whole of both targets
      # — 6 + 6, both filter-free, because unlike `--test threads` every test in them
      # is runnable here. (DL26's brief declared 11 from 6 + 5; the round added two to
      # `fiber-executor` rather than one, which is reported in `DL26-REPORT.md` §6.)
      #
      # `--no-default-features` is the job's usual set, and both targets pass under it
      # locally (`cargo test --test fiber-executor --no-default-features` → 4 passed
      # before the re-park test, 5 after).
      #
      # No `TENSION_TEST_ALLOW_SKIP`: a probe that cannot run must fail the job, not
      # become a green line with nothing behind it.
      - name: Stackful proofs
        run: |
          cargo test --manifest-path tension-core/Cargo.toml --no-default-features \
            --test fiber --test fiber-executor
